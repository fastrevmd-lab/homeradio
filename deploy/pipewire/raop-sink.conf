# Standalone PipeWire client that publishes a static AirPlay (RAOP) sink to the
# Yamaha receiver into the user's PipeWire daemon. Run by raop-sink.service,
# which radio-web starts on play and stops on stop: the RAOP module holds the
# RTSP session for as long as it is loaded, so unloading it is the only way to
# release the receiver (and to re-handshake after the receiver drops us).
# @RECEIVER_IP@ is filled in by provision.sh from receiver_url in config.toml.
# Keep this sink at 100%; loudness is controlled only through YXC.
context.properties = {
  core.daemon = false
  core.name = home-radio-raop
  module.x11.bell = false
}
context.spa-libs = {
  audio.convert.* = audioconvert/libspa-audioconvert
  support.*       = support/libspa-support
}
context.modules = [
  { name = libpipewire-module-rt flags = [ ifexists nofail ] }
  { name = libpipewire-module-protocol-native }
  { name = libpipewire-module-client-node }
  { name = libpipewire-module-adapter }
  { name = libpipewire-module-raop-sink
    args = {
      raop.ip = "@RECEIVER_IP@"
      raop.port = 5000
      raop.name = "Media-Room"
      raop.hostname = "Media-Room.local"
      raop.transport = "udp"
      raop.encryption.type = "none"
      raop.audio.codec = "PCM"
      stream.props = {
        node.name = "raop_sink.home-radio"
        node.description = "Yamaha receiver (AirPlay)"
        priority.session = 2000
      }
    }
  }
]
