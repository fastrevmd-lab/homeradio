# Always-present silent sink. cliamp blocks if its output has no sink, and the
# AirPlay sink (raop-sink.service) only exists while radio-web is playing, so
# streams fall back here and follow the RAOP sink (higher priority) when it appears.
context.objects = [
  { factory = adapter
    args = {
      factory.name     = support.null-audio-sink
      node.name        = "fallback_silence"
      node.description = "Silence (AirPlay not connected)"
      media.class      = "Audio/Sink"
      audio.position   = [ FL FR ]
      priority.session = 100
      priority.driver  = 100
      node.driver      = true
    }
  }
]
